<!DOCTYPE html>
<html lang="mg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f6f8">
  <title>Fianarana teny alemà</title>
  <link rel="stylesheet" href="./styles.css?v=5">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./config.js" defer></script>
  <script src="./app.js?v=5" defer></script>
</head>

<body>
<main>
  <section id="login-screen" class="card">
    <h1>Fianarana teny alemà</h1>

    <form id="login-form" class="stack">
      <div>
        <label for="access-code">Kaody fidirana</label>
        <input
          id="access-code"
          type="text"
          autocomplete="username"
          autocapitalize="none"
          placeholder="01_7351_abcd"
          required
        >
      </div>
      <button class="primary" type="submit">Hiditra</button>
    </form>

    <div id="login-message" class="message" role="status"></div>
  </section>

  <section id="app-screen" class="hidden">
    <header class="top-row">
      <div>
        <div id="participant-name" class="participant-name"></div>
        <div id="item-position" class="muted"></div>
      </div>

      <div id="earned-ariary" class="earned-badge" aria-live="polite">
        Vola azo: 0 Ariary
      </div>

      <button id="logout-button" class="small-button secondary" type="button">
        Hivoaka
      </button>
    </header>

    <section class="card">
      <label for="lesson-select">Lesona</label>
      <select id="lesson-select"></select>
      <div id="lesson-title" class="muted lesson-title"></div>

      <section class="progress-box" aria-live="polite">
        <strong id="word-check-progress">
          0 von 0 Wörtern erfolgreich getestet
        </strong>
        <div id="test-unlock-status" class="muted"></div>
      </section>

      <section class="test-box" aria-live="polite">
        <strong>Lektionstest</strong>
        <div id="test-status" class="muted">Teststatus wird geladen …</div>
        <div id="test-provisional-reward" class="test-reward hidden"></div>

        <div class="stack test-actions">
          <button id="test-start-button" class="test-button" type="button" disabled>
            Lektionstest starten
          </button>
          <button id="test-abandon-button" class="secondary hidden" type="button">
            Test abbrechen
          </button>
        </div>
      </section>

      <div class="word-status-row">
        <span id="current-word-status" class="status-badge">
          Wort-Check noch offen
        </span>
      </div>

      <div id="prompt" class="prompt" aria-live="polite">...</div>

      <div id="timer-panel" class="timer-panel hidden" aria-live="assertive">
        <div id="timer-label">Aufnahme läuft</div>
        <div id="timer-countdown">2.0</div>
        <div id="timer-help"></div>
      </div>

      <div class="stack">
        <button id="reveal-button" class="secondary" type="button">
          Asehoy ny dikanteny alemà
        </button>
        <div id="translation" class="translation hidden"></div>

        <button id="play-audio-button" class="secondary" type="button">
          Henoy ny teny alemà
        </button>
        <audio id="tts-player" class="hidden" controls></audio>

        <button id="record-button" class="primary" type="button">
          Aufnahme mit Bewertung
        </button>
        <button id="word-check-button" class="primary" type="button">
          Zeitbegrenzten Wort-Check starten
        </button>
        <button id="word-check-cancel-button" class="secondary hidden" type="button">
          Wort-Check abbrechen
        </button>
        <button id="stop-button" class="danger hidden" type="button">
          Fertig
        </button>

        <audio id="recording-player" class="hidden" controls></audio>
      </div>

      <div id="evaluation-panel" class="evaluation-panel hidden">
        <h2>Valin'ny fanombanana</h2>
        <div id="evaluation-result"></div>
      </div>

      <div class="nav-buttons">
        <button id="repeat-button" class="secondary" type="button">
          Avereno ity teny ity
        </button>
        <button id="skip-button" class="primary" type="button">
          Teny manaraka
        </button>
      </div>

      <div id="app-message" class="message" role="status"></div>

      <!-- TEMPORÄR: Reset-Button für die Testphase; später entfernen -->
      <div id="dev-reset-box" class="dev-reset-box">
        <button id="reset-tests-button" class="danger" type="button">
          Alle Tests zurücksetzen (Endtest &amp; Wort-Checks)
        </button>
      </div>
    </section>
  </section>
</main>

<div
  id="analysis-modal"
  class="modal-backdrop hidden"
  role="dialog"
  aria-modal="true"
  aria-labelledby="analysis-modal-title"
>
  <div class="modal-card">
    <div id="analysis-spinner" class="spinner" aria-hidden="true"></div>
    <h2 id="analysis-modal-title">Analyse läuft …</h2>
    <p id="analysis-modal-status" class="muted"></p>
    <div id="analysis-modal-result" class="modal-result"></div>
    <button id="analysis-modal-close" class="primary hidden" type="button">
      OK / Weiter
    </button>
  </div>
</div>
</body>
</html>
