<!DOCTYPE html>
<html lang="mg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f6f8">
  <title>Fianarana teny alemà</title>

  <link rel="stylesheet" href="./styles.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./config.js" defer></script>
  <script src="./app.js" defer></script>
</head>

<body>
<main>
  <section id="login-screen" class="card">
    <h1>Fianarana teny alemà</h1>

    <form id="login-form" class="stack">
      <div>
        <label for="access-code">Kaody fidirana</label>
        <input
          id="access-code"
          type="text"
          autocomplete="username"
          autocapitalize="none"
          placeholder="01_abcd"
          required
        >
      </div>

      <button class="primary" type="submit">Hiditra</button>
    </form>

    <div id="login-message" class="message" role="status"></div>
  </section>

  <section id="app-screen" class="hidden">
    <header class="top-row">
      <div>
        <div id="participant-name" class="participant-name"></div>
        <div id="item-position" class="muted"></div>
      </div>

      <button
        id="logout-button"
        class="small-button secondary"
        type="button"
      >
        Hivoaka
      </button>
    </header>

    <section class="card">
      <label for="lesson-select">Lesona</label>
      <select id="lesson-select"></select>

      <div id="lesson-title" class="muted lesson-title"></div>

      <div id="prompt" class="prompt" aria-live="polite">...</div>

      <div class="stack">
        <button id="reveal-button" class="secondary" type="button">
          Asehoy ny dikanteny alemà
        </button>

        <div id="translation" class="translation hidden"></div>

        <button id="play-audio-button" class="secondary" type="button">
          Henoy ny teny alemà
        </button>

        <audio id="tts-player" class="hidden" controls></audio>

        <button id="record-button" class="primary" type="button">
          Raketo ny valiny
        </button>

        <button id="stop-button" class="danger hidden" type="button">
          Atsaharo ny firaketana
        </button>

        <audio id="recording-player" class="hidden" controls></audio>
      </div>

      <div id="evaluation-panel" class="evaluation-panel hidden">
        <h2>Valin'ny fanombanana</h2>
        <div id="evaluation-result"></div>
      </div>

      <div class="nav-buttons">
        <button id="repeat-button" class="secondary" type="button">
          Avereno ity teny ity
        </button>

        <button id="skip-button" class="primary" type="button">
          Teny manaraka
        </button>
      </div>

      <div id="app-message" class="message" role="status"></div>
    </section>

    <details class="card settings">
      <summary>Fikirana fanombanana</summary>

      <label for="whisper-model">Whisper model ID</label>
      <input
        id="whisper-model"
        type="text"
        value="openai/whisper-large-v3"
        autocomplete="off"
      >

      <p class="muted">
        Ovay raha tsy eken'ny NanoGPT io model ID io.
      </p>
    </details>
  </section>

  <!-- The updated app.js can put the assembled API key here at runtime. -->
  <input id="api-key" type="hidden" autocomplete="off">
</main>
</body>
</html>
