<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f6f8">
  <title>LearnGerman Admin</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      font-family: system-ui, sans-serif;
      color: #18212b;
      background: #f4f6f8;
      font-size: 16px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 16px;
    }

    main {
      width: 100%;
      max-width: 760px;
      margin: 0 auto;
    }

    h1 {
      font-size: 1.4rem;
      line-height: 1.25;
    }

    .card {
      margin: 12px 0;
      padding: 16px;
      background: #fff;
      border: 1px solid #d9e0e6;
      border-radius: 14px;
    }

    label {
      display: block;
      margin: 12px 0 6px;
      font-weight: 650;
    }

    input,
    select,
    button {
      width: 100%;
      min-height: 48px;
      padding: 11px 13px;
      border-radius: 9px;
      font: inherit;
    }

    input,
    select {
      border: 1px solid #b8c2cc;
      background: #fff;
    }

    button {
      border: 0;
      font-weight: 700;
      cursor: pointer;
      touch-action: manipulation;
    }

    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .primary {
      color: #fff;
      background: #1769aa;
    }

    .secondary {
      color: #17324a;
      background: #e5edf4;
    }

    .danger {
      color: #fff;
      background: #6d7781;
    }

    .stack {
      display: grid;
      gap: 10px;
    }

    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .row button {
      width: auto;
      min-height: 42px;
      padding: 8px 12px;
    }

    .muted {
      color: #53616f;
      font-size: 0.92rem;
      overflow-wrap: anywhere;
    }

    .item {
      margin-top: 12px;
      padding: 14px;
      border: 1px solid #d9e0e6;
      border-radius: 10px;
    }

    .item h3 {
      margin: 0 0 6px;
    }

    .item-actions {
      display: grid;
      gap: 8px;
      margin-top: 10px;
    }

    .message {
      min-height: 24px;
      margin-top: 12px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .hidden {
      display: none !important;
    }

    audio {
      width: 100%;
      margin-top: 12px;
    }
  </style>
</head>

<body>
<main>
  <section id="login-screen" class="card">
    <h1>LearnGerman Admin</h1>
    <p class="muted">
      Sign in with the administrator access code.
    </p>

    <form id="login-form" class="stack">
      <div>
        <label for="access-code">Access code</label>
        <input
          id="access-code"
          type="text"
          autocomplete="username"
          autocapitalize="none"
          required
        >
      </div>

      <button class="primary" type="submit">Sign in</button>
    </form>

    <div id="login-message" class="message" role="status"></div>
  </section>

  <section id="admin-screen" class="hidden">
    <div class="card row">
      <div>
        <strong>Admin</strong>
        <div id="admin-email" class="muted"></div>
      </div>

      <button id="logout-button" class="danger" type="button">
        Sign out
      </button>
    </div>

    <section class="card">
      <h1>Generate German TTS</h1>

      <label for="api-key">NanoGPT API key</label>
      <input
        id="api-key"
        type="password"
        autocomplete="off"
        placeholder="Enter key for this session"
      >

      <p class="muted">
        The key is kept only in this page's memory and is not saved
        to Supabase.
      </p>

      <label for="lesson-select">Lesson</label>
      <select id="lesson-select"></select>

      <div class="stack" style="margin-top: 12px;">
        <button
          id="generate-missing-button"
          class="primary"
          type="button"
        >
          Generate missing audio
        </button>

        <button
          id="regenerate-all-button"
          class="secondary"
          type="button"
        >
          Regenerate all audio
        </button>
      </div>

      <div id="admin-message" class="message" role="status"></div>
      <div id="preview-container"></div>
      <div id="items-list"></div>
    </section>
  </section>
</main>

<script>
  const SUPABASE_URL =
    "https://coaiznrxtpdqatvfbsyi.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_D0adyb95if5W2IH5WA9JOQ_ENePqpoh";

  const TTS_API_URL =
    "https://api.nano-gpt.com/api/v1/audio/speech";

  const TTS_MODEL =
    "google/gemini-3.8-flash-tts";

  const TTS_VOICE = "Kore";
  const STORAGE_BUCKET = "learn-tts";

  const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

  let currentUser = null;
  let lessons = [];
  let items = [];
  let previewBlob = null;
  let previewItemId = null;
  let previewUrl = null;
  let batchIsRunning = false;

  const loginScreen = document.getElementById("login-screen");
  const adminScreen = document.getElementById("admin-screen");
  const loginMessage = document.getElementById("login-message");
  const adminMessage = document.getElementById("admin-message");
  const lessonSelect = document.getElementById("lesson-select");
  const itemsList = document.getElementById("items-list");
  const previewContainer =
    document.getElementById("preview-container");

  function setMessage(element, text, isError = false) {
    element.textContent = text;
    element.style.color = isError ? "#a12626" : "#236b37";
  }

  function getApiKey() {
    return document.getElementById("api-key").value.trim();
  }

  function getCostFromData(data) {
    if (!data || typeof data !== "object") return null;

    const pricing = data.x_nanogpt_pricing;

    if (pricing && typeof pricing === "object") {
      const amount = pricing.amount ?? pricing.cost;
      const value = Number(amount);

      if (Number.isFinite(value)) return value;
    }

    const usageCost = Number(data.usage?.cost);
    if (Number.isFinite(usageCost)) return usageCost;

    const directCost = Number(data.cost);
    if (Number.isFinite(directCost)) return directCost;

    return null;
  }

  function getCostFromHeaders(headers) {
    const candidates = [
      headers.get("x-nanogpt-pricing"),
      headers.get("x-nanogpt-cost"),
      headers.get("x-pricing")
    ].filter(Boolean);

    for (const raw of candidates) {
      try {
        const parsed = JSON.parse(raw);
        const amount = parsed.amount ?? parsed.cost;
        const value = Number(amount);

        if (Number.isFinite(value)) return value;
      } catch {
        const match = raw.match(/-?\d+(?:\.\d+)?/);

        if (match) {
          const value = Number(match[0]);
          if (Number.isFinite(value)) return value;
        }
      }
    }

    return null;
  }

  async function lookupCost(apiKey, requestId) {
    if (!requestId) return null;

    const url =
      "https://api.nano-gpt.com/api/v1/usage/requests/" +
      encodeURIComponent(requestId);

    try {
      const response = await fetch(url, {
        method: "GET",
        headers: {
          "x-api-key": apiKey,
          "Accept": "application/json"
        }
      });

      if (!response.ok) return null;

      const data = await response.json();
      return getCostFromData(data);
    } catch (error) {
      console.warn("Could not look up NanoGPT request cost:", error);
      return null;
    }
  }

  async function logTtsUsage({
    itemId,
    requestId,
    status,
    cost
  }) {
    if (!currentUser) return;

    const { error } = await supabaseClient
      .from("learn_api_usage")
      .insert({
        client_request_id: crypto.randomUUID(),
        user_id: currentUser.id,
        item_id: itemId || null,
        provider: "NanoGPT",
        model_name: TTS_MODEL,
        operation: "tts",
        status,
        estimated_cost: cost,
        currency: "USD",
        provider_request_id: requestId || null,
        pricing_version:
          "NanoGPT response or usage endpoint; verify against account",
        completed_at: new Date().toISOString()
      });

    if (error) {
      console.error("Could not log TTS request:", error);
    }
  }

  async function verifyAdmin(user) {
    const { data, error } = await supabaseClient
      .from("learn_profiles")
      .select("display_name, role")
      .eq("id", user.id)
      .single();

    if (error) throw error;

    if (data.role !== "admin") {
      throw new Error("This account does not have the admin role.");
    }

    return data;
  }

  async function enterAdmin(user) {
    const profile = await verifyAdmin(user);

    currentUser = user;
    loginScreen.classList.add("hidden");
    adminScreen.classList.remove("hidden");

    document.getElementById("admin-email").textContent =
      profile.display_name || user.email || "";

    await loadLessons();
  }

  async function loadLessons() {
    setMessage(adminMessage, "Loading lessons...");

    const { data, error } = await supabaseClient
      .from("learn_lessons")
      .select("id, slug, title, order_index")
      .order("order_index");

    if (error) {
      console.error(error);
      setMessage(adminMessage, error.message, true);
      return;
    }

    lessons = data || [];
    lessonSelect.replaceChildren();

    for (const lesson of lessons) {
      const option = document.createElement("option");
      option.value = lesson.id;
      option.textContent = lesson.title;
      lessonSelect.appendChild(option);
    }

    if (lessons.length === 0) {
      items = [];
      renderItems();
      setMessage(adminMessage, "No lessons found.", true);
      return;
    }

    await loadItems(lessons[0].id);
    setMessage(adminMessage, "");
  }

  async function loadItems(lessonId) {
    setMessage(adminMessage, "Loading items...");

    const { data, error } = await supabaseClient
      .from("learn_items")
      .select(
        "id, lesson_id, order_index, prompt_mg, target_de, tts_audio_path"
      )
      .eq("lesson_id", lessonId)
      .order("order_index");

    if (error) {
      console.error(error);
      items = [];
      renderItems();
      setMessage(adminMessage, error.message, true);
      return;
    }

    items = data || [];
    clearPreview();
    renderItems();
    setMessage(adminMessage, "");
  }

  function getPublicAudioUrl(path) {
    return supabaseClient
      .storage
      .from(STORAGE_BUCKET)
      .getPublicUrl(path)
      .data
      .publicUrl;
  }

  function clearPreview() {
    previewBlob = null;
    previewItemId = null;

    if (previewUrl) {
      URL.revokeObjectURL(previewUrl);
      previewUrl = null;
    }

    previewContainer.replaceChildren();
  }

  function showPreview(blob, item) {
    if (previewUrl) URL.revokeObjectURL(previewUrl);

    previewBlob = blob;
    previewItemId = item.id;
    previewUrl = URL.createObjectURL(blob);

    const wrapper = document.createElement("div");
    wrapper.className = "item";

    const title = document.createElement("strong");
    title.textContent = `Unsaved preview: ${item.target_de}`;

    const player = document.createElement("audio");
    player.controls = true;
    player.src = previewUrl;

    wrapper.append(title, player);
    previewContainer.replaceChildren(wrapper);
  }

  function renderItems() {
    itemsList.replaceChildren();

    for (const item of items) {
      const card = document.createElement("article");
      card.className = "item";

      const title = document.createElement("h3");
      title.textContent = `${item.order_index}. ${item.target_de}`;

      const prompt = document.createElement("div");
      prompt.className = "muted";
      prompt.textContent = `Malagasy prompt: ${item.prompt_mg}`;

      const status = document.createElement("div");
      status.className = "muted";
      status.textContent = item.tts_audio_path
        ? `Saved audio: ${item.tts_audio_path}`
        : "No saved audio.";

      const actions = document.createElement("div");
      actions.className = "item-actions";

      const generateButton = document.createElement("button");
      generateButton.className = "primary";
      generateButton.type = "button";
      generateButton.textContent = "Generate preview";
      generateButton.disabled = batchIsRunning;
      generateButton.addEventListener("click", () => {
        generatePreview(item);
      });

      const saveButton = document.createElement("button");
      saveButton.className = "secondary";
      saveButton.type = "button";
      saveButton.textContent = "Save preview to Supabase";
      saveButton.disabled =
        batchIsRunning ||
        !previewBlob ||
        previewItemId !== item.id;
      saveButton.addEventListener("click", () => {
        savePreview(item);
      });

      actions.append(generateButton, saveButton);
      card.append(title, prompt, status, actions);

      if (item.tts_audio_path) {
        const savedAudio = document.createElement("audio");
        savedAudio.controls = true;
        savedAudio.src = getPublicAudioUrl(item.tts_audio_path);
        card.appendChild(savedAudio);
      }

      itemsList.appendChild(card);
    }
  }

  function setBatchButtonsDisabled(disabled) {
    document.getElementById(
      "generate-missing-button"
    ).disabled = disabled;

    document.getElementById(
      "regenerate-all-button"
    ).disabled = disabled;

    lessonSelect.disabled = disabled;
  }

  async function generateAudio(item, apiKey) {
    const response = await fetch(TTS_API_URL, {
      method: "POST",
      headers: {
        "x-api-key": apiKey,
        "Content-Type": "application/json",
        "Accept": "audio/wav, audio/*, application/json"
      },
      body: JSON.stringify({
        model: TTS_MODEL,
        input: item.target_de,
        voice: TTS_VOICE,
        instructions:
          "Speak clearly in neutral Standard German as spoken in Germany. " +
          "Use a natural, calm pronunciation.",
        response_format: "wav"
      })
    });

    const requestId = response.headers.get("x-request-id");
    let cost = getCostFromHeaders(response.headers);

    if (!response.ok) {
      const errorText = await response.text();

      if (cost === null) {
        cost = await lookupCost(apiKey, requestId);
      }

      await logTtsUsage({
        itemId: item.id,
        requestId,
        status: "error",
        cost
      });

      throw new Error(
        `NanoGPT HTTP ${response.status}: ${errorText.slice(0, 700)}`
      );
    }

    const contentType =
      (response.headers.get("content-type") || "").toLowerCase();

    if (contentType.includes("application/json")) {
      const body = await response.json();

      if (cost === null) {
        cost = getCostFromData(body);
      }

      if (cost === null) {
        cost = await lookupCost(apiKey, requestId);
      }

      await logTtsUsage({
        itemId: item.id,
        requestId,
        status: "error",
        cost
      });

      throw new Error(
        "Expected audio bytes, but NanoGPT returned JSON: " +
        JSON.stringify(body).slice(0, 700)
      );
    }

    const blob = await response.blob();

    if (blob.size === 0) {
      if (cost === null) {
        cost = await lookupCost(apiKey, requestId);
      }

      await logTtsUsage({
        itemId: item.id,
        requestId,
        status: "error",
        cost
      });

      throw new Error("NanoGPT returned an empty audio file.");
    }

    if (cost === null) {
      cost = await lookupCost(apiKey, requestId);
    }

    await logTtsUsage({
      itemId: item.id,
      requestId,
      status: "success",
      cost
    });

    return blob;
  }

  async function uploadAudioAndUpdateItem(item, blob) {
    const lesson = lessons.find(value => value.id === item.lesson_id);

    if (!lesson) {
      throw new Error("Could not find the item's lesson.");
    }

    const oldPath = item.tts_audio_path;

    // A unique path prevents a failed regeneration from damaging the
    // currently saved audio file.
    const version =
      new Date().toISOString().replace(/[:.]/g, "-") +
      "_" +
      crypto.randomUUID().slice(0, 8);

    const newPath = `${lesson.slug}/${item.id}_${version}.wav`;

    const { error: uploadError } = await supabaseClient
      .storage
      .from(STORAGE_BUCKET)
      .upload(newPath, blob, {
        contentType: "audio/wav",
        upsert: false
      });

    if (uploadError) {
      throw new Error(`Storage upload failed: ${uploadError.message}`);
    }

    const { error: updateError } = await supabaseClient
      .from("learn_items")
      .update({ tts_audio_path: newPath })
      .eq("id", item.id);

    if (updateError) {
      // Keep the old database path intact. Try to remove the newly
      // uploaded file so it does not become an orphan.
      await supabaseClient
        .storage
        .from(STORAGE_BUCKET)
        .remove([newPath]);

      throw new Error(
        `Audio uploaded, but the database update failed: ` +
        updateError.message
      );
    }

    item.tts_audio_path = newPath;

    // Once the new file is saved and referenced, remove the old one.
    // If deletion fails, the new file remains active; the old file is
    // only an unused storage object.
    if (
      oldPath &&
      oldPath !== newPath &&
      !oldPath.includes("://")
    ) {
      const { error: removeError } = await supabaseClient
        .storage
        .from(STORAGE_BUCKET)
        .remove([oldPath]);

      if (removeError) {
        console.warn("Could not remove previous TTS file:", removeError);
      }
    }
  }

  async function generatePreview(item) {
    const apiKey = getApiKey();

    if (!apiKey) {
      setMessage(adminMessage, "Enter the NanoGPT API key first.", true);
      return;
    }

    if (item.tts_audio_path) {
      const confirmed = window.confirm(
        `This item already has saved audio. Generate a new preview for ` +
        `"${item.target_de}"?`
      );

      if (!confirmed) return;
    }

    clearPreview();
    setMessage(adminMessage, `Generating "${item.target_de}"...`);

    try {
      const blob = await generateAudio(item, apiKey);
      showPreview(blob, item);
      renderItems();

      setMessage(
        adminMessage,
        `Preview generated for "${item.target_de}". Listen, then save it.`,
        false
      );
    } catch (error) {
      console.error(error);
      setMessage(adminMessage, error.message || String(error), true);
    }
  }

  async function savePreview(item) {
    if (!previewBlob || previewItemId !== item.id) {
      setMessage(
        adminMessage,
        "Generate a preview for this item first.",
        true
      );
      return;
    }

    if (
      item.tts_audio_path &&
      !window.confirm(`Replace the saved audio for "${item.target_de}"?`)
    ) {
      return;
    }

    setMessage(adminMessage, `Saving "${item.target_de}"...`);

    try {
      await uploadAudioAndUpdateItem(item, previewBlob);
      renderItems();
      clearPreview();

      setMessage(
        adminMessage,
        `Saved audio for "${item.target_de}".`,
        false
      );
    } catch (error) {
      console.error(error);
      setMessage(adminMessage, error.message || String(error), true);
    }
  }

  async function runBatchGeneration({ onlyMissing }) {
    const apiKey = getApiKey();

    if (!apiKey) {
      setMessage(adminMessage, "Enter the NanoGPT API key first.", true);
      return;
    }

    const lesson = lessons.find(
      value => value.id === lessonSelect.value
    );

    if (!lesson) {
      setMessage(adminMessage, "Select a lesson first.", true);
      return;
    }

    const targets = onlyMissing
      ? items.filter(item => !item.tts_audio_path)
      : [...items];

    if (targets.length === 0) {
      setMessage(
        adminMessage,
        onlyMissing
          ? "All items in this lesson already have saved audio."
          : "There are no items to generate.",
        false
      );
      return;
    }

    if (!onlyMissing) {
      const confirmed = window.confirm(
        `Regenerate audio for all ${targets.length} items in ` +
        `"${lesson.title}"? Existing audio will be replaced after each ` +
        "new file is generated and uploaded successfully."
      );

      if (!confirmed) return;
    }

    clearPreview();
    batchIsRunning = true;
    setBatchButtonsDisabled(true);
    renderItems();

    let succeeded = 0;
    const failures = [];

    try {
      for (let index = 0; index < targets.length; index++) {
        const item = targets[index];

        setMessage(
          adminMessage,
          `Generating ${index + 1} of ${targets.length}: ` +
          `"${item.target_de}"...`
        );

        try {
          const blob = await generateAudio(item, apiKey);
          await uploadAudioAndUpdateItem(item, blob);
          succeeded++;
          renderItems();
        } catch (error) {
          console.error(
            `Generation failed for "${item.target_de}":`,
            error
          );

          failures.push({
            word: item.target_de,
            message: error.message || String(error)
          });
        }
      }
    } finally {
      batchIsRunning = false;
      setBatchButtonsDisabled(false);
      renderItems();
    }

    if (failures.length === 0) {
      setMessage(
        adminMessage,
        `Finished. Generated and saved ${succeeded} audio file(s).`,
        false
      );
      return;
    }

    const summary = failures
      .map(failure => `${failure.word}: ${failure.message}`)
      .join("\n");

    setMessage(
      adminMessage,
      `Finished with ${succeeded} successful item(s) and ` +
      `${failures.length} failure(s):\n${summary}`,
      true
    );
  }

  document
    .getElementById("generate-missing-button")
    .addEventListener("click", () => {
      runBatchGeneration({ onlyMissing: true });
    });

  document
    .getElementById("regenerate-all-button")
    .addEventListener("click", () => {
      runBatchGeneration({ onlyMissing: false });
    });

  document
    .getElementById("login-form")
    .addEventListener("submit", async event => {
      event.preventDefault();
      setMessage(loginMessage, "Signing in...");

      const code = document
        .getElementById("access-code")
        .value
        .trim()
        .toLowerCase();

      if (!code) return;

      const { data, error } = await supabaseClient.auth
        .signInWithPassword({
          email: `${code}@malagasy.local`,
          password: code
        });

      if (error) {
        console.error(error);
        setMessage(loginMessage, "Invalid access code.", true);
        return;
      }

      try {
        await enterAdmin(data.user);
      } catch (adminError) {
        console.error(adminError);
        await supabaseClient.auth.signOut();
        setMessage(loginMessage, adminError.message, true);
      }
    });

  lessonSelect.addEventListener("change", async () => {
    clearPreview();
    await loadItems(lessonSelect.value);
  });

  document
    .getElementById("logout-button")
    .addEventListener("click", async () => {
      document.getElementById("api-key").value = "";
      clearPreview();
      await supabaseClient.auth.signOut();
      location.reload();
    });

  async function restoreSession() {
    const { data, error } = await supabaseClient.auth.getSession();

    if (error || !data.session?.user) return;

    try {
      await enterAdmin(data.session.user);
    } catch (adminError) {
      console.error(adminError);
      await supabaseClient.auth.signOut();
      setMessage(loginMessage, adminError.message, true);
    }
  }

  restoreSession();
</script>
</body>
</html>
